name: Glacier.HPC CLI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
#            libgen3-dev \
            libopenblas-dev \
            libomp-dev 

      - name: Configure CMake
        run: cmake -B cmake-build-test -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build Targets
        run: cmake --build cmake-build-test --target saxpy_test

      - name: Run Tests
        run: |
          ctest --test-dir cmake-build-test --output-on-failure

